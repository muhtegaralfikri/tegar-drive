<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Login - Tegar Drive</title>
    <link rel="stylesheet" href="/style.css?v=23" />
  </head>
  <body>
    <main class="login-screen">
      <section class="login-card">
        <div class="brand">
          <div class="brand-icon" data-icon="hard-drive"></div>
          <div>
            <h1>Tegar Drive</h1>
            <p>Private file storage</p>
          </div>
        </div>

        <div class="field">
          <label>User</label>
          <input id="user" autocomplete="username" placeholder="tegar" value="tegar" />
        </div>
        <div class="field">
          <label>Password</label>
          <div class="password-wrap">
            <input id="password" autocomplete="current-password" placeholder="Password" type="password" />
            <button id="togglePassword" class="input-icon" type="button" title="Tampilkan password"></button>
          </div>
        </div>
        <p id="loginError" class="error" hidden></p>
        <button id="loginBtn" class="primary">
          <span class="spinner" hidden></span>
          <span id="loginText">Masuk</span>
        </button>
      </section>
    </main>

    <script src="/app.js?v=23"></script>
  </body>
</html>
