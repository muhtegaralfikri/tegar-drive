<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Drive - Tegar Drive</title>
    <link rel="stylesheet" href="/style.css?v=10" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div class="identity">
          <div class="brand-icon small" data-icon="hard-drive"></div>
          <div>
            <h1>Tegar Drive</h1>
            <p id="crumb">/</p>
          </div>
        </div>
        <button id="logoutBtn" class="icon-btn" title="Keluar"></button>
      </header>

      <section class="workspace">
        <aside class="sidebar">
          <button id="upBtn" class="side-action"></button>
          <button id="newFolderBtn" class="side-action primary"></button>
          <button id="trashBtn" class="side-action"></button>
          <label class="side-action upload">
            <span data-icon="upload"></span>
            <span>Upload</span>
            <input id="uploadInput" type="file" multiple />
          </label>
        </aside>

        <section class="content">
          <div class="content-head">
            <h2>Files</h2>
            <section class="storage-card">
              <div>
                <strong id="storageUsed">-</strong>
                <small id="storageText">Memuat...</small>
              </div>
              <progress id="storageProgress" value="0" max="100"></progress>
            </section>
            <div class="search-wrap">
              <span data-icon="search"></span>
              <input id="search" placeholder="Cari file..." />
            </div>
            <div class="sort-wrap">
              <select id="sortBy" title="Urutkan">
                <option value="name">Nama</option>
                <option value="modified">Tanggal</option>
                <option value="size">Ukuran</option>
                <option value="type">Tipe</option>
              </select>
              <button id="sortDir" class="icon-btn" title="Balik urutan">A-Z</button>
            </div>
          </div>

          <div id="drop">
            <span data-icon="cloud-upload"></span>
            <strong>Lepas file di sini</strong>
            <small>atau gunakan tombol upload</small>
          </div>
          <section id="uploadPanel" hidden>
            <div>
              <strong id="uploadTitle">Mengirim file</strong>
              <span id="uploadPercent">0%</span>
            </div>
            <progress id="uploadProgress" value="0" max="100"></progress>
            <small id="uploadDetail"></small>
          </section>
          <section id="bulkBar" hidden>
            <strong id="selectedCount">0 dipilih</strong>
            <button id="bulkMove">Move</button>
            <button id="bulkCopy">Copy</button>
            <button id="bulkDelete" class="danger">Delete</button>
          </section>
          <div class="file-head">
            <span>Nama</span>
            <span>Ukuran</span>
            <span>Diubah</span>
            <span></span>
          </div>
          <section id="files"></section>
        </section>
      </section>

      <dialog id="previewDialog">
        <header class="preview-head">
          <div>
            <strong id="previewTitle"></strong>
            <dl id="previewMeta"></dl>
          </div>
          <button id="closePreview" class="icon-btn" title="Tutup"></button>
        </header>
        <section id="previewBody"></section>
        <footer class="preview-actions">
          <button id="previewDownload" class="primary">Download</button>
        </footer>
      </dialog>
    </main>

    <script src="/app.js?v=10"></script>
  </body>
</html>
