<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Drive - Tegar Drive</title>
    <link rel="stylesheet" href="/style.css?v=5" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div class="identity">
          <div class="brand-icon small" data-icon="hard-drive"></div>
          <div>
            <h1>Tegar Drive</h1>
            <p id="crumb">/</p>
          </div>
        </div>
        <button id="logoutBtn" class="icon-btn" title="Keluar"></button>
      </header>

      <section class="workspace">
        <aside class="sidebar">
          <button id="upBtn" class="side-action"></button>
          <button id="newFolderBtn" class="side-action primary"></button>
          <label class="side-action upload">
            <span data-icon="upload"></span>
            <span>Upload</span>
            <input id="uploadInput" type="file" multiple />
          </label>
        </aside>

        <section class="content">
          <div class="content-head">
            <div>
              <h2>Files</h2>
              <p>Kelola folder dan file di HDD STB</p>
            </div>
            <div class="search-wrap">
              <span data-icon="search"></span>
              <input id="search" placeholder="Cari file..." />
            </div>
          </div>

          <div id="drop">
            <span data-icon="cloud-upload"></span>
            <strong>Lepas file di sini</strong>
            <small>atau gunakan tombol upload</small>
          </div>
          <section id="files"></section>
        </section>
      </section>

      <dialog id="previewDialog">
        <header class="preview-head">
          <strong id="previewTitle"></strong>
          <button id="closePreview" class="icon-btn" title="Tutup"></button>
        </header>
        <section id="previewBody"></section>
        <footer class="preview-actions">
          <button id="previewDownload" class="primary">Download</button>
        </footer>
      </dialog>
    </main>

    <script src="/app.js?v=5"></script>
  </body>
</html>
