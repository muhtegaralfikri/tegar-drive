<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Drive - Tegar Drive</title>
    <link rel="stylesheet" href="/style.css?v=24" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div class="identity">
          <div class="brand-icon small" data-icon="hard-drive"></div>
          <div>
            <h1>Tegar Drive</h1>
            <p id="topContext">My Files</p>
          </div>
        </div>
        <button id="logoutBtn" class="icon-btn" title="Keluar"></button>
      </header>

      <section class="workspace">
        <aside class="sidebar">
          <nav class="nav-list" aria-label="Drive navigation">
            <button id="filesBtn" class="nav-item primary">
              <span data-icon="folder"></span>
              <span>My Files</span>
            </button>
            <button id="trashBtn" class="nav-item">
              <span data-icon="trash"></span>
              <span>Trash</span>
            </button>
          </nav>
        </aside>

        <section class="content">
          <header class="page-head">
            <div>
              <div class="breadcrumb-line">
                <button id="upBtn" class="crumb-up"></button>
                <p id="crumb">/</p>
              </div>
              <h2 id="pageTitle">My Files</h2>
              <p id="pageHint" hidden>Items in Trash are kept until permanently deleted.</p>
            </div>
          </header>

          <section class="storage-card">
            <h2>Root Volume</h2>
            <div>
              <strong id="storageText">Memuat...</strong>
              <small id="storageUsed">-</small>
            </div>
            <progress id="storageProgress" value="0" max="100"></progress>
          </section>

          <div class="content-head">
            <details id="newMenu" class="new-menu">
              <summary>+ New</summary>
              <div class="new-panel">
                <label>
                  <span data-icon="upload"></span>
                  <span>Upload files</span>
                  <input id="uploadInput" type="file" multiple />
                </label>
                <button id="newFolderBtn" type="button">
                  <span data-icon="folder-plus"></span>
                  <span>New folder</span>
                </button>
              </div>
            </details>

            <div class="search-wrap">
              <span data-icon="search"></span>
              <input id="search" placeholder="Search files..." />
            </div>

            <select id="sortBy" class="sort-select" title="Sort">
              <option value="name-asc">Name A-Z</option>
              <option value="name-desc">Name Z-A</option>
              <option value="modified-desc">Newest</option>
              <option value="modified-asc">Oldest</option>
              <option value="size-desc">Largest</option>
              <option value="size-asc">Smallest</option>
              <option value="type-asc">Type</option>
            </select>
          </div>

          <div id="drop">
            <span data-icon="cloud-upload"></span>
            <strong>Lepas file di sini</strong>
          </div>
          <section id="uploadPanel" hidden>
            <div>
              <strong id="uploadTitle">Mengirim file</strong>
              <span id="uploadPercent">0%</span>
            </div>
            <progress id="uploadProgress" value="0" max="100"></progress>
            <small id="uploadDetail"></small>
          </section>
          <section id="bulkBar" hidden>
            <strong id="selectedCount">0 dipilih</strong>
            <button id="bulkMove">Move</button>
            <button id="bulkCopy">Copy</button>
            <button id="bulkDelete" class="danger">Delete</button>
          </section>
          <div class="file-head">
            <span><input id="selectAll" class="pick" type="checkbox" aria-label="Pilih semua file" /> Name</span>
            <span>Size</span>
            <span>Modified</span>
            <span></span>
          </div>
          <section id="files"></section>
        </section>
      </section>

      <dialog id="previewDialog">
        <header class="preview-head">
          <div>
            <strong id="previewTitle"></strong>
            <dl id="previewMeta"></dl>
          </div>
          <button id="closePreview" class="icon-btn" title="Tutup"></button>
        </header>
        <section id="previewBody"></section>
        <footer class="preview-actions">
          <button id="previewDownload" class="primary">Download</button>
        </footer>
      </dialog>
    </main>

    <script src="/app.js?v=24"></script>
  </body>
</html>
