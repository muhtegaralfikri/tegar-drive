name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked

  linux-arm64:
    runs-on: ubuntu-24.04-arm
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked
      - run: |
          mkdir -p dist
          strip target/release/tegar-drive
          tar -C target/release -czf dist/tegar-drive-linux-arm64.tar.gz tegar-drive
          sha256sum dist/tegar-drive-linux-arm64.tar.gz > dist/tegar-drive-linux-arm64.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: tegar-drive-linux-arm64
          path: dist/*
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes
